name: Backend syntax check

on:
  pull_request:
    branches: [main]
    paths:
      - "Ngan-hang/vn_banking_dashboard_free/backend/**"
      - ".github/workflows/backend-check.yml"
  push:
    branches: [main, "fix/**"]
    paths:
      - "Ngan-hang/vn_banking_dashboard_free/backend/**"
      - "Ngan-hang/vn_banking_dashboard_free/index.html"
      - ".github/workflows/backend-check.yml"

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install -r Ngan-hang/vn_banking_dashboard_free/backend/requirements.txt
      - name: Compile backend modules
        run: python -m compileall -q Ngan-hang/vn_banking_dashboard_free/backend
      - name: Run backend validation tests
        env:
          APP_ENV: test
        run: python -m unittest discover -s Ngan-hang/vn_banking_dashboard_free/backend/tests -v
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check dashboard JavaScript syntax
        run: |
          python -c "from pathlib import Path; import re; p=Path('Ngan-hang/vn_banking_dashboard_free/index.html'); s=p.read_text(encoding='utf-8'); m=re.search(r'<script>(.*?)</script>', s, re.S); assert m, 'inline dashboard script not found'; Path('/tmp/dashboard.js').write_text(m.group(1), encoding='utf-8')"
          node --check /tmp/dashboard.js
