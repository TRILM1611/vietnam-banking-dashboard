name: Dashboard page syntax check

on:
  pull_request:
    branches: [main]
    paths:
      - "Ngan-hang/vn_banking_dashboard_free/index.html"
      - "Ngan-hang/vn_banking_dashboard_free/BANK_REGISTRY_SWEEP_2026-11-05.csv"
      - ".github/workflows/dashboard-check.yml"
  push:
    branches: [main, "feature/**"]
    paths:
      - "Ngan-hang/vn_banking_dashboard_free/index.html"
      - "Ngan-hang/vn_banking_dashboard_free/BANK_REGISTRY_SWEEP_2026-11-05.csv"
      - ".github/workflows/dashboard-check.yml"

jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Extract inline dashboard JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("Ngan-hang/vn_banking_dashboard_free/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, flags=re.S)
          if not scripts:
              raise SystemExit("No inline dashboard script found")
          Path("/tmp/dashboard.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
      - name: Check dashboard JavaScript syntax
        run: node --check /tmp/dashboard.js
